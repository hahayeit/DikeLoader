[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dikeloader"
version = "1.0.0"
description = "Install .ipa, .tipa, and .deb on a Dopamine-jailbroken iPhone 14 (iOS 16.1) with TrollStore/CoreTrust, Wi-Fi SSH, LiveContainer, and dylib injection."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "DikeLoader" }]
keywords = ["ios", "sideload", "ipa", "iphone"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Environment :: Win32 (MS Windows)",
]
dependencies = [
    "pymobiledevice3>=10.0",
    "customtkinter>=5.2.0",
    "cryptography>=42.0.0",
    "srp>=1.0.20",
    "httpx>=0.27",
    "keyring>=25.0",
    "Pillow>=10.0",
    "anisette>=1.2.4",
    "certifi>=2024.0",
    "truststore>=0.10.0",
    "paramiko>=3.4.0",
]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4.0"]

[project.scripts]
dikeloader = "dikeloader.__main__:main"

[project.gui-scripts]
dikeloader-gui = "dikeloader.__main__:main"

[project.urls]
Homepage = "https://github.com/hahayeit/DikeLoader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dikeloader = ["py.typed", "certs/*.pem"]
